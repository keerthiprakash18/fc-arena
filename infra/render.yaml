# Render.com blueprint — free-tier friendly, using Neon for Postgres.
# 1. Push the repo to GitHub.
# 2. In Render, "New +" → "Web Service" → connect repo.
# 3. Set env vars: DATABASE_URL, SECRET_KEY, CORS_ALLOWED_ORIGINS.
# 4. Deploy.

services:
  - type: web
    name: fcarena-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "bash render_migrate.sh && gunicorn config.wsgi --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        sync: false
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://fc-arena.onrender.com,http://localhost:8080"
      - key: OCR_PROVIDER
        value: "auto"
      - key: DATABASE_URL
        sync: false
